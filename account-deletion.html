        let currentLanguage =
            localStorage.getItem("accountDeletionLanguage") || "en";

        function updateLanguage() {

            const t = translations[currentLanguage];

            document.documentElement.lang =
                currentLanguage;

            Object.keys(t).forEach(key => {

                const element =
                    document.getElementById(key);

                if (element) {
                    element.innerHTML =
                        t[key];
                }

            });

            document.getElementById("langLabel").textContent =
                currentLanguage === "en"
                    ? "KO"
                    : "EN";

            document.title =
                currentLanguage === "en"
                    ? "TikiTalk | Account Deletion"
                    : "TikiTalk | 계정 삭제";
        }

        document
            .getElementById("langToggle")
            .addEventListener("click", function () {

                currentLanguage =
                    currentLanguage === "en"
                        ? "ko"
                        : "en";

                localStorage.setItem(
                    "accountDeletionLanguage",
                    currentLanguage
                );

                updateLanguage();
            });
