<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description"
content="SMK is a mobile app development company creating innovative digital products.">

<title>아동 안전 표준 / Child Safety Standards</title>

<link rel="stylesheet" href="style.css">
<style>
  /* 본문 가독성 및 정렬 스타일 */
  .terms-body h1 {
    font-size: 2rem;
    margin-bottom: 30px;
    text-align: center;
  }
  .terms-body h2 {
    font-size: 1.4rem;
    margin-top: 35px;
    margin-bottom: 15px;
    color: var(--text, #111);
    border-bottom: 2px solid var(--line, #eee);
    padding-bottom: 8px;
  }
  .terms-body h3 {
    font-size: 1.15rem;
    margin-top: 25px;
    margin-bottom: 10px;
    color: var(--text, #222);
  }
  .terms-body p, .terms-body li {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text-sub, #555);
    margin-bottom: 12px;
  }
  .terms-body ul, .terms-body ol {
    padding-left: 20px;
    margin-bottom: 15px;
  }
  .terms-body strong {
    color: var(--text, #111);
  }
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
<div class="container nav">
<div class="logo-wrap">
<a href="index.html" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
<img src="assets/logo.png" alt="SMK Logo" class="logo">
</a>
</div>

<button id="langToggle" class="lang-btn">KR</button>
</div>
</header>

<!-- MAIN -->
<main>
  <div class="container" style="padding: 60px 20px; max-width: 800px; margin: 0 auto;">
    
    <!-- 동적으로 언어별 파일이 로드되는 컨테이너 -->
    <div id="dynamic-content-container" class="terms-body">
      <p style="text-align: center; padding: 40px; color: #888;">Loading...</p>
    </div>

    <!-- 하단 홈으로 가기 버튼 영역 -->
    <div style="margin-top: 60px; text-align: center; border-top: 1px solid var(--line, #eaeaea); padding-top: 40px;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: var(--panel, #f4f5f7); color: var(--text, #333); padding: 12px 24px; border-radius: 999px; font-weight: 600; border: 1px solid var(--line, #ddd); transition: background 0.2s;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span id="homeBtnText">홈으로 가기</span>
      </a>
    </div>

  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-left">
      <div class="logo-wrap footer-logo">
        <img src="assets/logo.png" alt="SMK Logo" class="logo small">
      </div>
      <p class="footer-copyright">© 2024 SMK DevLabs. All rights reserved.</p>
    </div>
    <div class="footer-right">
      <ul class="footer-links-list">
        <li><a href="terms.html" data-en="Terms of Service" data-ko="이용약관">Terms of Service</a></li>
        <li><a href="child-safety.html" data-en="Child Safety Standards" data-ko="아동 안전 표준">Child Safety Standards</a>
        </li>
        <li><a href="privacy.html" data-en="Privacy Policy" data-ko="개인정보처리방침">Privacy Policy</a></li>
      </ul>
    </div>
  </div>
</footer>

<a href="#" class="back-to-top" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none"
    stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</a>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const langButton = document.getElementById("langToggle");
    const homeBtnText = document.getElementById("homeBtnText");
    const container = document.getElementById("dynamic-content-container");

    let currentLang = localStorage.getItem("smk-language") || "ko";

    async function loadPrivacyContent(lang) {
      try {
        const fileName = lang === "ko" ? "child-safety-ko.html" : "child-safety-en.html";
        const response = await fetch(fileName);
        if (!response.ok) throw new Error("Network response was not ok");
        const htmlText = await response.text();
        container.innerHTML = htmlText;
      } catch (error) {
        console.error("Failed to load privacy file:", error);
        container.innerHTML = "<p style='text-align: center; color: red;'>내용을 불러오지 못했습니다. (privacy-ko.html 또는 privacy-en.html 파일이 있는지 확인해주세요)</p>";
      }
    }

    async function applyLanguage(lang) {
      await loadPrivacyContent(lang);

      document.documentElement.lang = lang;

      // 홈 버튼 텍스트 변경
      if (homeBtnText) {
        homeBtnText.textContent = lang === "ko" ? "홈으로 가기" : "Back to Home";
      }

      // 언어 토글 버튼 텍스트 변경
      if (langButton) {
        langButton.innerText = lang === "ko" ? "EN" : "KR";
      }

      // 푸터 링크 텍스트 실시간 변경
      document.querySelectorAll(".footer-links-list a").forEach(el => {
        const targetText = el.getAttribute(`data-${lang}`);
        if (targetText) {
          el.textContent = targetText;
        }
      });

      localStorage.setItem("smk-language", lang);
    }

    // 초기 실행
    await applyLanguage(currentLang);

    // 버튼 클릭 시 언어 전환
    if (langButton) {
      langButton.addEventListener("click", async () => {
        currentLang = currentLang === "ko" ? "en" : "ko";
        await applyLanguage(currentLang);
      });
    }
  });

  window.addEventListener('scroll', () => {
    const backToTop = document.querySelector('.back-to-top');
    if (backToTop) {
      if (window.scrollY > 100) {
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('site_lang') || 'ko';
    setIndexLanguage(savedLang);
  });
</script>
<script src="script.js"></script>
</body>
</html>
